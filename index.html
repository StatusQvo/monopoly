<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <title>Тестовое задание frontend</title>
  </head>
  <body class="amnfr">
    <div class="container main-container py-4">
      <div
        class="newPlayer-container row g-3 align-items-center justify-content-center"
      >
        <div class="col-8 col-md-6 col-lg-8">
          <div class="accordion" id="accordionNewPlayer">
            <div class="accordion-item new-player-container">
              <h2 class="accordion-header" id="headingOne">
                <button
                  class="accordion-button collapsed"
                  type="button"
                  data-bs-toggle="collapse"
                  data-bs-target="#collapseOne"
                  aria-expanded="true"
                  aria-controls="collapseOne"
                >
                  Добавить игрока
                </button>
              </h2>
              <div
                id="collapseOne"
                class="accordion-collapse collapse"
                aria-labelledby="headingOne"
                data-bs-parent="#accordionNewPlayer"
              >
                <div class="accordion-body">
                  <form onsubmit="event.preventDefault()">
                    <div class="row">
                      <div class="col-8 col-md-10 col-lg-5">
                        <label for="player-name" class="form-label mt-3"
                          >Имя игрока</label
                        >
                        <input
                          type="text"
                          name="player-name"
                          id="player-name"
                          class="form-control"
                          required
                        />
                        <p class="repeat-error">
                          Такое имя уже есть. Придумайте другое
                        </p>
                      </div>
                      <div class="col-8 col-md-10 col-lg-5">
                        <label for="start-balance" class="form-label mt-3"
                          >Стартовый капитал</label
                        >
                        <input
                          type="number"
                          name="start-balance"
                          id="start-balance"
                          class="form-control"
                          step="1000"
                          min="1000"
                          max="999000000"
                          value="15000000"
                        />
                      </div>
                      <div class="col-2 ps-5 pt-3 mt-4">
                        <button type="submit" class="btn btn-add">
                          <span class="plus-icon pb-2">+</span>
                        </button>
                      </div>
                    </div>
                  </form>
                </div>
                <!-- accordion body  -->
              </div>
              <!-- accordion collapse  -->
            </div>
            <!-- accordion item  -->
          </div>
          <!-- accordion  -->
        </div>
        <!-- col  -->
      </div>
      <!-- row  new player-->

      <div class="players-container container">
        <div class="row">
          <table class="players-table col-12 mb-6 lg-6">
            <thead>
              <tr>
                <th class="ps-2 pe-2">Имя игрока</th>
                <th class="ps-2 pe-2">Баланс</th>
                <th class="ps-2 pe-2">$ количество</th>
                <th class="ps-2 pe-2">Отнять / Прибавить</th>
                <th class="ps-2 pe-2">Получатель / Отправитель</th>
                <th class="ps-2 pe-2">Перевести</th>
                <th class="ps-2 pe-2">История</th>
                <th class="ps-2 pe-2">Удалить</th>
              </tr>
            </thead>
            <tbody>
              <!--PLAYERS HERE-->
            </tbody>
          </table>
        </div>
      </div>
      <!-- row  players list-->
    </div>
    <!-- container  -->
    <script src="./node_modules/bootstrap/dist/js/bootstrap.bundle.js"></script>
    <script type="module" src="./js/script.js"></script>
  </body>
</html>
