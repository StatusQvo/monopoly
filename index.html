<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <title>Тестовое задание frontend</title>
  </head>
  <body class="amnfr">
    <div class="container main-container py-4">
      <div class="row g-3 align-items-center justify-content-center">
        <div class="col-8 col-md-6 col-lg-8">
          <div class="accordion" id="accordionNewPlayer">
            <div class="accordion-item new-player-container">
              <h2 class="accordion-header" id="headingOne">
                <button
                  class="accordion-button collapsed"
                  type="button"
                  data-bs-toggle="collapse"
                  data-bs-target="#collapseOne"
                  aria-expanded="true"
                  aria-controls="collapseOne"
                >
                  Добавить игрока
                </button>
              </h2>
              <div
                id="collapseOne"
                class="accordion-collapse collapse"
                aria-labelledby="headingOne"
                data-bs-parent="#accordionNewPlayer"
              >
                <div class="accordion-body">
                  <form onsubmit="event.preventDefault()">
                    <div class="row">
                      <div class="col-8 col-md-10 col-lg-5">
                        <label for="player-name" class="form-label mt-3"
                          >Имя игрока</label
                        >
                        <input
                          type="text"
                          name="player-name"
                          id="player-name"
                          class="form-control"
                          required
                        />
                      </div>
                      <div class="col-8 col-md-10 col-lg-5">
                        <label for="start-balance" class="form-label mt-3"
                          >Стартовый капитал</label
                        >
                        <input
                          type="number"
                          name="start-balance"
                          id="start-balance"
                          class="form-control"
                          step="1000"
                          min="1000"
                          max="999000000"
                          value="15000000"
                        />
                      </div>
                      <div class="col-2 ps-5 pt-3 mt-4">
                        <button type="submit" class="btn btn-add">
                          <span class="plus-icon pb-2">+</span>
                        </button>
                      </div>
                    </div>
                  </form>
                </div>
                <!-- accordion body  -->
              </div>
              <!-- accordion collapse  -->
            </div>
            <!-- accordion item  -->
          </div>
          <!-- accordion  -->
        </div>
        <!-- col  -->
      </div>
      <!-- row  new player-->

      <div class="players-container container">
        <div class="row">
          <table class="col-12 mb-6 lg-6">
            <thead>
              <tr>
                <th>Имя игрока</th>
                <th>Баланс</th>
                <th>$ количество</th>
                <th>Отнять / Прибавить</th>
                <th>Получатель / Отправитель</th>
                <th>История</th>
              </tr>
            </thead>
            <tbody>
              <tr name="player-item">
                <td
                  name="player-name"
                  class="player-list-item col-6 col-md-6 col-lg-2"
                >
                  Игрок 1
                </td>
                <td
                  name="player-balance"
                  class="player-list-item col-6 col-md-6 col-lg-2"
                >
                  10.000.000
                </td>
                <td
                  name="player-quantity"
                  class="player-list-item col-6 col-md-6 col-lg-2"
                >
                  <input
                    type="number"
                    name="operation"
                    class="form-control"
                    step="1000"
                    min="0"
                    max="999000000"
                    placeholder="0"
                  />
                </td>
                <td name="player-operation" class="player-list-item">
                  <div class="scroll">
                    <div class="scroll__item"></div>
                    <div
                      class="scroll__description d-flex justify-content-between col-3"
                    >
                      <span>-</span>
                      <span>+</span>
                    </div>
                  </div>
                </td>
                <td name="player-selector" class="player-list-item"></td>
                <td
                  name="player-history"
                  class="player-list-item col-8 col-md-6 col-lg-3 p-1"
                >
                  <div class="accordion mt-2 mb-2" id="accordionSelector">
                    <div
                      class="accordion-item player-history-container ms-2 me-2"
                    >
                      <h2 class="accordion-header" id="headingTwo">
                        <button
                          class="accordion-button collapsed"
                          type="button"
                          data-bs-toggle="collapse"
                          data-bs-target="#collapseTwo"
                          aria-expanded="true"
                          aria-controls="collapseTwo"
                        >
                          История средств
                        </button>
                      </h2>
                      <div
                        id="collapseTwo"
                        class="accordion-collapse collapse"
                        aria-labelledby="headingTwo"
                        data-bs-parent="#accordionSelector"
                      >
                        <div class="accordion-body">
                          <div class="transaction">
                            <table>
                              <thead>
                                <tr>
                                  <th>От кого</th>
                                  <th>Движение средств</th>
                                  <th>Куда</th>
                                </tr>
                              </thead>
                              <tbody>
                                <tr>
                                  <td>Игрок 1</td>
                                  <td>
                                    <div class="move-pic move-pic--left">
                                      <span>15.000.000</span>
                                    </div>
                                  </td>
                                  <td>Вход в игру</td>
                                </tr>
                                <tr>
                                  <td>Игрок 1</td>
                                  <td>
                                    <div class="move-pic move-pic--right">
                                      <span>5.000.000</span>
                                    </div>
                                  </td>
                                  <td>Игрок 2</td>
                                </tr>
                              </tbody>
                            </table>
                          </div>
                        </div>
                        <!-- accordion body  -->
                      </div>
                      <!-- accordion collapse  -->
                    </div>
                    <!-- accordion item  -->
                  </div>
                  <!-- accordion  -->
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
      <!-- row  players list-->
    </div>
    <!-- container  -->
    <script src="/node_modules/bootstrap/dist/js/bootstrap.bundle.js"></script>
    <script src="js/script.js"></script>
  </body>
</html>
