<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <title>Тестовое задание frontend</title>
  </head>
  <body class="amnfr">
    <div class="container main-container py-4">
      <div class="row g-3 align-items-center justify-content-center">
        <div class="col-8 col-md-6 col-lg-8">
          <div class="accordion" id="accordionExample">
            <div class="accordion-item new-player-container">
              <h2 class="accordion-header" id="headingOne">
                <button
                  class="accordion-button"
                  type="button"
                  data-bs-toggle="collapse"
                  data-bs-target="#collapseOne"
                  aria-expanded="true"
                  aria-controls="collapseOne"
                >
                  Добавить игрока
                </button>
              </h2>
              <div
                id="collapseOne"
                class="accordion-collapse collapse show"
                aria-labelledby="headingOne"
                data-bs-parent="#accordionExample"
              >
                <div class="accordion-body">
                  <form onsubmit="event.preventDefault()">
                    <div class="row">
                      <div class="col-8 col-md-10 col-lg-5">
                        <label for="player-name" class="form-label mt-3"
                          >Имя игрока</label
                        >
                        <input
                          type="text"
                          name="player-name"
                          id="player-name"
                          class="form-control"
                        />
                      </div>
                      <div class="col-8 col-md-10 col-lg-5">
                        <label for="start-balance" class="form-label mt-3"
                          >Стартовый капитал</label
                        >
                        <input
                          type="number"
                          name="start-balance"
                          id="start-balance"
                          class="form-control"
                          step="1000"
                          min="1000"
                          max="999000000"
                          value="15000000"
                        />
                      </div>
                      <div class="col-2 ps-5 pt-3 mt-4">
                        <button type="submit" class="btn btn-add">
                          <span class="plus-icon pb-2">+</span>
                        </button>
                      </div>
                    </div>
                  </form>
                </div>
                <!-- accordion body  -->
              </div>
              <!-- accordion collapse  -->
            </div>
            <!-- accordion item  -->
          </div>
          <!-- accordion  -->
        </div>
        <!-- col  -->
      </div>
      <!-- row  new player-->

      <div class="players-container container">
        <div class="row">
          <table class="col-12 mb-6 lg-6">
            <thead>
              <tr>
                <th>Имя игрока</th>
                <th>$ количество</th>
                <th>Отнять / Прибавить</th>
                <th>Получатель / Отправитель</th>
              </tr>
            </thead>
            <tbody>
              <tr name="player-item">
                <td name="player-name" class="player-list-item">Игрок 1</td>
                <td name="player-quantity" class="player-list-item">
                  <input
                    type="number"
                    name="start-balance"
                    id="start-balance"
                    class="form-control"
                    step="1000"
                    min="1000"
                    max="999000000"
                    value="15000000"
                  />
                </td>
                <td>
                  <div class="scroll">
                    <div class="scroll__item"></div>
                    <div>
                      <p>-</p>
                      <p>+</p>
                    </div>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
      <!-- row  players list-->
    </div>
    <!-- container  -->
    <script src="/node_modules/bootstrap/dist/js/bootstrap.bundle.js"></script>
    <script src="js/script.js"></script>
  </body>
</html>
